name: CI
# One run per PR: a task branch gets only the pull_request run. Push runs only on
# main, where Publish version waits for it.
on:
  pull_request:
    # edited: a new body (Refs #N, Security-Review:) re-runs the scope gate.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the stale run. Main runs get one group per commit,
# so a later merge never cancels a pending run (and its release).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Required CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # check-pr-scope.py and release_version.py diff from the merge base with main.
          fetch-depth: 0
      # Branch <type>/<N>-<slug>, Refs #N, one note changes/<N>-<slug>.md, Security-Review line.
      # Reads the event file only; no PR text reaches a shell.
      - name: PR scope
        if: github.event_name == 'pull_request'
        run: python3 scripts/check-pr-scope.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: python -m pip install bandit pip-audit
      - run: ./scripts/fast-check.sh
      - run: bandit -q -r backend
      # Frontend production deps at moderate or worse, backend deps at any finding; an audit
      # source outage only warns, a vulnerability or a broken audit fails the check.
      - name: Dependency audit
        run: python3 scripts/dependency-audit.py --soft-unavailable
      - name: Validate version and publication contracts
        env:
          VERSION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          VERSION_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$VERSION_BASE" || "$VERSION_BASE" =~ ^0+$ ]]; then VERSION_BASE=''; fi
          python3 scripts/release_version.py check ${VERSION_BASE:+--base "$VERSION_BASE"} --head "$VERSION_HEAD"
          python3 scripts/verify-release-workflow.py
