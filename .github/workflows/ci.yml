name: CI
# One run per PR: a task branch gets only the pull_request run. Push runs only on
# main, where Publish version waits for it.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the stale run; main runs always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Required CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: python -m pip install bandit
      - run: ./scripts/fast-check.sh
      - run: bandit -q -r backend
      - name: Validate version and publication contracts
        env:
          VERSION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          VERSION_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$VERSION_BASE" || "$VERSION_BASE" =~ ^0+$ ]]; then VERSION_BASE=''; fi
          python3 scripts/release_version.py check ${VERSION_BASE:+--base "$VERSION_BASE"} --head "$VERSION_HEAD"
          python3 scripts/verify-release-workflow.py
